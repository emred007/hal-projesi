<svg width="240" height="60" viewBox="0 0 240 60" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="walletGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#8B4513;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#A0522D;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#CD853F;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="walletInside" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#F5DEB3;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFF8DC;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Cüzdan ana gövde -->
  <g transform="translate(10, 10)">
    <!-- Cüzdan dış kısmı -->
    <rect x="0" y="0" width="45" height="40" rx="4" fill="url(#walletGradient)" stroke="#654321" stroke-width="2"/>
    
    <!-- Cüzdan içi (açık görünüyor - boş) -->
    <rect x="3" y="8" width="39" height="30" rx="2" fill="url(#walletInside)" opacity="0.9"/>
    
    <!-- Cüzdan katlanma çizgisi -->
    <line x1="0" y1="8" x2="45" y2="8" stroke="#654321" stroke-width="1.5"/>
    
    <!-- Cüzdan cep bölümleri (boş görünüyor) -->
    <rect x="6" y="12" width="33" height="8" rx="1" fill="#FFFFFF" opacity="0.3"/>
    <rect x="6" y="22" width="33" height="8" rx="1" fill="#FFFFFF" opacity="0.3"/>
    <rect x="6" y="32" width="33" height="4" rx="1" fill="#FFFFFF" opacity="0.3"/>
    
    <!-- Boş cüzdan ifadesi - üzgün yüz veya boş işareti -->
    <circle cx="22.5" cy="20" r="8" fill="none" stroke="#FF6B6B" stroke-width="2" stroke-dasharray="2,2" opacity="0.6"/>
    <text x="22.5" y="24" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#FF6B6B" text-anchor="middle" opacity="0.7">?</text>
    
    <!-- Cüzdan fermuar/kilit -->
    <circle cx="42" cy="20" r="3" fill="#FFD700" stroke="#FFA500" stroke-width="1"/>
  </g>
  
  <!-- Site ismi -->
  <text x="70" y="28" font-family="Arial, sans-serif" font-size="18" font-weight="800" fill="#FFFFFF" letter-spacing="1">PARAM OLSADA</text>
  <text x="70" y="45" font-family="Arial, sans-serif" font-size="18" font-weight="800" fill="#FFC107" letter-spacing="1">BEN ALSAM</text>
  
  <!-- Para işareti - cüzdanın yanında -->
  <circle cx="200" cy="30" r="12" fill="#FFD700" stroke="#FFA500" stroke-width="2"/>
  <text x="200" y="36" font-family="Arial, sans-serif" font-size="16" font-weight="900" fill="#FFFFFF" text-anchor="middle">₺</text>
  
  <!-- Ok işareti (cüzdan → para) -->
  <path d="M 215 30 L 185 30" stroke="#FFC107" stroke-width="3" stroke-linecap="round" marker-end="url(#arrowhead)"/>
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#FFC107"/>
    </marker>
  </defs>
</svg>

